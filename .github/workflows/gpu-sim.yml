name: CUDA unit tests (simulated H100)

# Optional, non-required check. The hosted runners have no GPU, so this builds
# the CUDA unit tests and launches them on a simulated NVIDIA H100
# (https://github.com/pantheongpu/pantheonsim). A simulator cannot reproduce
# hardware-specific behavior or timing, so it complements real-GPU testing and
# does not replace it.

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "Source/**"
      - "Tools/**"
      - "CMakeLists.txt"
      - ".github/workflows/gpu-sim.yml"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  cuda-sim:
    name: CUDA 13.0, simulated H100
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    env:
      CUDACXX: /usr/local/cuda-13.0/bin/nvcc
      # The simulator needs a shared CUDA runtime (CMake links the static one by default).
      CUDAFLAGS: -cudart shared
      MAKEFLAGS: -j3

    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up the simulated GPU and CUDA toolkit
        uses: pantheongpu/setup-pantheonsim@ca87fe3143b29166822b923d6050945c5179408c # v0.1.5
        with:
          gpu: nvidia/h100
          cuda-toolkit: "13.0"

      # The project scripts build the unit tests; CUDA_ARCH_SM_TYPE is passed to
      # nvcc as "-arch", so "compute_90" gives PTX-only device code, which is what
      # the simulator runs. The scripts are called with DO_LAUNCH=0 and the
      # binaries are launched below under "vgpu run".
      - name: Build cuda grid unit test
        run: |
          ./Tools/UnitTests/cuda/build-and-run-unit-test-cuda-grid.sh \
            "$GITHUB_WORKSPACE" "$GITHUB_WORKSPACE/Build-grid" g++ gcc RelWithDebInfo ON "" f 0 compute_90 0

      - name: Run cuda grid unit test
        run: vgpu run ./Build-grid/Source/UnitTests/unit-test-cuda-grid 0

      - name: Build cuda internalscheme unit test
        run: |
          ./Tools/UnitTests/cuda/build-and-run-unit-test-internalscheme-cuda.sh \
            "$GITHUB_WORKSPACE" "$GITHUB_WORKSPACE/Build-is" g++ gcc RelWithDebInfo ON OFF f 0 compute_90 0

      # Same four launches as the project script runs with DO_LAUNCH=1.
      - name: Run cuda internalscheme unit test
        working-directory: Build-is
        run: |
          T=./Source/UnitTests/unit-test-internalscheme
          C="--cuda-gpus 0 --num-cuda-threads x:4,y:4,z:4 --use-cuda"
          vgpu run $T --time-steps 10 --point-source x:10,y:10,z:10 --point-source-ex $C
          vgpu run $T --time-steps 10 --point-source x:10,y:10,z:10 --point-source-ex --use-ca-cb $C
          vgpu run $T --time-steps 200 --use-tfsf $C
          vgpu run $T --time-steps 200 --use-tfsf --use-ca-cb $C
